name: Release

# Builds macOS .app/.dmg bundles and attaches them to a GitHub Release.
#
# Primary trigger: run this workflow manually (Actions tab or `gh workflow
# run release.yml -f bump=patch`) to bump the version, tag, build, and
# publish in one go. Pushing a `v*` tag directly also works as a fallback
# (skips the bump job, builds whatever is already at that tag).
#
# Builds are unsigned/unnotarized (see README's Gatekeeper note) — v1 scope
# is macOS-only, so the build job only runs on macos-latest.
#
# The `build` job also produces signed updater artifacts (a separate ed25519
# signing scheme from code-signing/notarization, used by `tauri-plugin-updater`
# to verify downloads — see README's "Self-update" section) and attaches the
# generated `latest.json` manifest to the release. This relies on the repo
# being public: a private repo's release-asset URLs aren't fetchable by the
# updater's plain HTTPS GET. See README.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  bump-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version, commit, and tag
        id: bump
        run: |
          set -euo pipefail

          pnpm version "${{ inputs.bump }}" --no-git-tag-version
          VERSION=$(node -p "require('./package.json').version")

          node -e "
            const fs = require('fs');
            const path = 'src-tauri/tauri.conf.json';
            const conf = JSON.parse(fs.readFileSync(path, 'utf8'));
            conf.version = '$VERSION';
            fs.writeFileSync(path, JSON.stringify(conf, null, 2) + '\n');
          "

          sed -i "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml

          git add package.json pnpm-lock.yaml src-tauri/tauri.conf.json src-tauri/Cargo.toml
          git commit -m "chore: release v$VERSION"
          git tag -a "v$VERSION" -m "v$VERSION"

          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Push commit and tag
        run: git push --follow-tags

  build:
    needs: bump-version
    if: always() && (needs.bump-version.result == 'success' || needs.bump-version.result == 'skipped')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump-version.outputs.tag || github.ref_name }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.bump-version.outputs.tag || github.ref_name }}
          releaseName: "Conflate ${{ needs.bump-version.outputs.tag || github.ref_name }}"
          releaseDraft: true
          prerelease: false

  publish-release:
    needs: [bump-version, build]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate notes and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ needs.bump-version.outputs.tag || github.ref_name }}"
          notes=$(gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name="$tag" --jq .body)
          gh release edit "$tag" --draft=false --title "$tag" --notes "$notes"
